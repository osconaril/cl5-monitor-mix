<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CL5 Monitor Mix</title>
    <style>
      body { color: #111827; font-family: system-ui, sans-serif; margin: 3rem; max-width: 34rem; }
      button, input { box-sizing: border-box; font: inherit; margin: .4rem 0; padding: .7rem; width: 100%; }
      button { background: #1d4ed8; border: 0; border-radius: .35rem; color: white; }
      label { display: block; margin-top: 1.5rem; }
      #status { color: #b91c1c; }
    </style>
  </head>
  <body>
    <h1>CL5 Monitor Mix</h1>
    <p>Choose the console this admin session will use.</p>
    <button type="button" onclick="start('fake')">Launch fake console</button>
    <label>Real CL5 address<input id="address" placeholder="192.168.1.50:49280"></label>
    <button type="button" onclick="start('real')">Connect to real CL5</button>
    <p id="status" role="alert"></p>
    <script>
      async function start(mode) {
        const status = document.getElementById('status');
        status.textContent = 'Starting…';
        try {
          await window.__TAURI__.core.invoke('launch_console_mode', {
            mode,
            address: document.getElementById('address').value,
          });
        } catch (error) {
          status.textContent = String(error);
        }
      }
    </script>
  </body>
</html>
