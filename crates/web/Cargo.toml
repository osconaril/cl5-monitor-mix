[package]
name = "cl5-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gloo-net = "0.6"
gloo-timers = "0.3"
serde.workspace = true
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Event", "Location", "MessageEvent", "WebSocket", "Window"] }
yew = { version = "0.21", features = ["csr"] }
