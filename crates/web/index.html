<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CL5 Monitor Mix</title>
    <link data-trunk rel="rust" data-bin="cl5-web">
    <style>
      * { box-sizing: border-box; }
      html, body { min-width: 0; min-height: 100%; margin: 0; background: #111; }
      body { padding: 1rem; color: #fff; font: 18px system-ui, sans-serif; }
      #app { width: min(100%, 34rem); margin: 0 auto; display: grid; gap: 1rem; }
      form, label { display: grid; gap: .35rem; }
      input, button { width: 100%; min-height: 44px; font: inherit; padding: .5rem; }
      button { border: 0; border-radius: .4rem; background: #4cf; color: #002; font-weight: 700; }
      @media (orientation: landscape) { #app { width: min(100%, 48rem); } }
    </style>
  </head>
  <body><main id="app"></main></body>
</html>
