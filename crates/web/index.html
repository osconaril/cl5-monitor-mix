<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CL5 Monitor Mix</title>
    <link data-trunk rel="rust" data-bin="cl5-web">
    <link data-trunk rel="copy-file" href="touch-controls.js">
    <script defer src="/touch-controls.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body { min-width: 0; min-height: 100%; margin: 0; background: #111; }
      body { padding: 1rem; color: #fff; font: 18px system-ui, sans-serif; }
      #app { width: min(100%, 34rem); margin: 0 auto; display: grid; gap: 1rem; }
      form, label { display: grid; gap: .35rem; }
      input, button, select { width: 100%; min-height: 44px; font: inherit; padding: .5rem; }
      button { border: 0; border-radius: .4rem; background: #4cf; color: #002; font-weight: 700; }
      .scene-bar { position: sticky; top: 0; z-index: 1; padding: .7rem; border-radius: .4rem; background: #223; display: grid; gap: .15rem; }
      .scene-bar strong { font-size: 1.1rem; }
      .panel, .user-card { background: #1d1d1d; padding: 1rem; border-radius: .5rem; margin: 1rem 0; }
      .users { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 1rem; }
      .user-card { margin: 0; overflow-wrap: anywhere; }
      .user-card form { margin-top: .8rem; }
      fieldset { border: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .25rem; }
      .mix-choice { display: flex; align-items: center; gap: .25rem; font-size: .9rem; }
      .mix-choice input { width: auto; min-height: 1.25rem; }
      .history { padding-left: 1.2rem; overflow-wrap: anywhere; }
      .history small { color: #bbb; }
      .delete-note { color: #fbb; }
      .mix-picker { display: grid; gap: .75rem; }
      .mix-heading { display: flex; align-items: center; gap: 1rem; }
      .mix-heading button { width: auto; }
      .channel-strips { display: grid; gap: .75rem; margin-bottom: 1rem; max-height: 65dvh; overflow: auto; overscroll-behavior: contain; overflow-anchor: none; }
      .channel-strip { min-width: 0; padding: .75rem; background: #222; border-radius: .5rem; }
      .channel-strip h3 { margin: 0 0 .5rem; overflow-wrap: anywhere; }
      .channel-color { flex: 0 0 14px; height: 14px; border: 1px solid #aaa; border-radius: 3px; }
      .pan-control input { min-height: 44px; }
      .strip-heading { display: flex; align-items: center; gap: .25rem; }
      .strip-heading h3 { flex: 1; min-width: 0; }
      .reorder-handle { width: 44px; flex-shrink: 0; touch-action: none; cursor: grab; }
      .channel-strip[data-drop-target] { outline: 3px solid #4cf; outline-offset: -3px; }
      .send-control { margin-bottom: .5rem; }
      .send-control input { touch-action: none; padding: 0; cursor: grab; }
      .send-control input[data-adjusting] { outline: 3px solid #4cf; cursor: grabbing; }
      .fader-hint { font-size: .8rem; color: #ccc; }
      button[aria-pressed="true"] { background: #ffb454; }
      button:disabled, input:disabled { opacity: .55; }
      @media (orientation: landscape) {
        body:has(.performer) { padding: .35rem; }
        #app { width: min(100%, 48rem); }
        body:has(.performer) .scene-bar { padding: .2rem .5rem; display: flex; align-items: baseline; gap: .5rem; white-space: nowrap; overflow: hidden; }
        body:has(.performer) .scene-bar strong { font-size: 1rem; overflow: hidden; text-overflow: ellipsis; }
        body:has(.performer) .scene-bar small { font-size: .75rem; flex-shrink: 0; }
        .performer h1 { font-size: 1rem; margin: .25rem 0; }
        .performer p:empty { display: none; }
        .mix-heading h2 { font-size: 1rem; margin: .25rem 0; }
        .mix-heading { justify-content: space-between; }
        .fader-hint { margin: .25rem 0; }
        .channel-strips { display: flex; height: max(270px, calc(100dvh - 160px)); max-height: none; overflow-y: hidden; overflow-x: auto; }
        .channel-strip { flex: 0 0 160px; display: grid; grid-template-rows: auto minmax(90px, 1fr) 44px 44px; gap: .25rem; padding: .35rem; }
        .channel-strip h3 { font-size: .9rem; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .send-control { min-height: 0; margin: 0; grid-template-rows: auto minmax(44px, 1fr); justify-items: center; }
        .send-control input { writing-mode: vertical-lr; direction: rtl; width: 44px; height: 100%; min-height: 0; }
        .channel-strips:has(.pan-control) { height: max(330px, calc(100dvh - 160px)); }
        .channel-strip:has(.pan-control) { grid-template-rows: auto minmax(90px, 1fr) auto 44px 44px; }
        .pan-control input[type=range] { writing-mode: horizontal-tb; direction: ltr; height: 44px; width: 100%; min-height: 44px; }
        .channel-strip button { font-size: .85rem; padding: .25rem; }
      }
      .layout-editor fieldset { display: block; min-width: 0; }
      .layout-channel, .layout-group { margin: .5rem 0; padding: .5rem; background: #222; border-radius: .5rem; }
      .layout-channel strong { display: block; overflow-wrap: anywhere; }
      .layout-channel button { margin: .25rem; }
      .layout-editor .group-member { display: flex; align-items: center; min-height: 44px; gap: .5rem; overflow-wrap: anywhere; }
      .layout-editor input[type=checkbox] { width: 24px; min-height: 24px; flex-shrink: 0; }
      .layout-editor input:not([type=checkbox]) { width: 100%; box-sizing: border-box; }
    </style>
  </head>
  <body><main id="app"></main></body>
</html>
