<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor Mix</title>
<style>
* { box-sizing: border-box; }
html { background: #111; }
body { min-width: 0; margin: 0; padding: 1rem; color: #fff; background: #111; font: 18px system-ui, sans-serif; }
main { width: min(100%, 34rem); margin: 0 auto; display: grid; gap: 1rem; }
label { display: grid; gap: .35rem; }
input, button { width: 100%; min-height: 44px; font: inherit; padding: .5rem; }
button { border: 0; border-radius: .4rem; background: #4cf; color: #002; font-weight: 700; }
@media (orientation: landscape) { main { width: min(100%, 48rem); } }
</style></head><body><main id="app"></main></body></html>
